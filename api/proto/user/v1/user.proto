syntax = "proto3";

package user.v1;

option go_package = "github.com/nithibodee/7-solutions-backend-test/api/proto/user/v1;userv1";

import "google/protobuf/timestamp.proto";

// UserService exposes a minimal subset of the user management API over gRPC.
service UserService {
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message GetUserRequest {
  string id = 1;
}

message UserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}
